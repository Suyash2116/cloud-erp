<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manufacturing Cloud ERP</title>
  <style>
    :root { --primary: #1e3a8a; --bg: #f8fafc; --card: #ffffff; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: #0f172a; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    .card { background: var(--card); border-radius: 8px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
    h1, h2, h3 { color: var(--primary); margin-top: 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .full { grid-column: span 2; }
    label { font-weight: 600; font-size: 0.875rem; display: block; margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; }
    button { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 4px; font-weight: 600; cursor: pointer; width: 100%; font-size: 1rem; }
    button:hover { opacity: 0.9; }
    #resultCard { display: none; text-align: center; }
    #qrImage { margin: 16px 0; border: 1px solid #e2e8f0; padding: 8px; border-radius: 4px; }
    .url-box { background: #f1f5f9; padding: 10px; border-radius: 4px; word-break: break-all; font-family: monospace; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Manufacturing Cloud ERP Dashboard</h1>
    
    <form id="erpForm">
      <div class="card">
        <h2>1. Raw Material Intake</h2>
        <div class="grid">
          <div><label>Batch / Lot Number</label><input type="text" id="batchNo" required placeholder="e.g. BATCH-2026-001"></div>
          <div><label>Supplier Name</label><input type="text" id="supplier" required placeholder="e.g. Acme Metals Ltd"></div>
          <div><label>Material Name</label><input type="text" id="materialName" required placeholder="e.g. Stainless Steel 304 Sheets"></div>
          <div><label>Quantity Received (kg/units)</label><input type="number" id="materialQty" required placeholder="1500"></div>
          <div><label>Intake Date</label><input type="date" id="intakeDate" required></div>
          <div><label>Inspector Name</label><input type="text" id="intakeInspector" required placeholder="e.g. R. K. Sharma"></div>
        </div>
      </div>

      <div class="card">
        <h2>2. Production & Processing</h2>
        <div class="grid">
          <div><label>Finished Product Name</label><input type="text" id="productName" required placeholder="e.g. Enclosure Box Assembly"></div>
          <div><label>Units Produced</label><input type="number" id="unitsProduced" required placeholder="500"></div>
          <div><label>Machine / Line ID</label><input type="text" id="lineId" required placeholder="e.g. Line-3 (CNC Cut)"></div>
          <div><label>Production Operator</label><input type="text" id="operator" required placeholder="e.g. S. Srivastava"></div>
          <div class="full"><label>Process Notes</label><textarea id="processNotes" rows="2" placeholder="Cutting, Stamping, and Powder Coating completed cleanly."></textarea></div>
        </div>
      </div>

      <div class="card">
        <h2>3. Quality Control (QC)</h2>
        <div class="grid">
          <div><label>QC Approval Status</label>
            <select id="qcStatus">
              <option value="PASSED">PASSED</option>
              <option value="PASSED WITH REMARKS">PASSED WITH REMARKS</option>
              <option value="REJECTED">REJECTED</option>
            </select>
          </div>
          <div><label>QC Inspector</label><input type="text" id="qcInspector" required placeholder="e.g. A. Verma"></div>
          <div class="full"><label>Defects / Inspection Remarks</label><input type="text" id="qcRemarks" placeholder="Zero defects observed during stress test."></div>
        </div>
      </div>

      <div class="card">
        <h2>4. Dispatch Details</h2>
        <div class="grid">
          <div><label>Customer / Destination</label><input type="text" id="customer" required placeholder="e.g. Apex Industrial Systems"></div>
          <div><label>Dispatch Date</label><input type="date" id="dispatchDate" required></div>
          <div><label>Vehicle / Tracking No.</label><input type="text" id="trackingNo" required placeholder="e.g. UP16-AT-9988"></div>
          <div><label>Dispatch Officer</label><input type="text" id="dispatchOfficer" required placeholder="e.g. M. Kumar"></div>
        </div>
      </div>

      <button type="submit">Generate ERP Report, Public Link & QR Code</button>
    </form>

    <div class="card" id="resultCard">
      <h2>Public ERP Report Generated Successfully</h2>
      <p>Scan the QR code below or open the link to view/download the full PDF report.</p>
      
      <img id="qrImage" src="" alt="Public QR Code">
      
      <div style="margin-top: 15px;">
        <label>Publicly Accessible URL:</label>
        <div class="url-box" id="publicUrlText"></div>
      </div>
      
      <div style="margin-top: 20px; display: flex; gap: 10px;">
        <a id="openLinkBtn" href="#" target="_blank" style="text-decoration: none; width: 100%;"><button type="button">Open Public Report Page</button></a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('erpForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const payload = {
        b: document.getElementById('batchNo').value,
        s: document.getElementById('supplier').value,
        m: document.getElementById('materialName').value,
        q: document.getElementById('materialQty').value,
        id: document.getElementById('intakeDate').value,
        ii: document.getElementById('intakeInspector').value,
        p: document.getElementById('productName').value,
        up: document.getElementById('unitsProduced').value,
        l: document.getElementById('lineId').value,
        op: document.getElementById('operator').value,
        pn: document.getElementById('processNotes').value,
        qc: document.getElementById('qcStatus').value,
        qi: document.getElementById('qcInspector').value,
        qr: document.getElementById('qcRemarks').value,
        c: document.getElementById('customer').value,
        dd: document.getElementById('dispatchDate').value,
        t: document.getElementById('trackingNo').value,
        do: document.getElementById('dispatchOfficer').value
      };

      const jsonString = JSON.stringify(payload);
      const encodedData = btoa(encodeURIComponent(jsonString));

      const publicUrl = `${window.location.origin}/view?data=${encodedData}`;

      const response = await fetch('/api/generate-qr', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: publicUrl })
      });

      const result = await response.json();

      if (result.qrCode) {
        document.getElementById('qrImage').src = result.qrCode;
        document.getElementById('publicUrlText').innerText = publicUrl;
        document.getElementById('openLinkBtn').href = publicUrl;
        document.getElementById('resultCard').style.display = 'block';
        document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth' });
      }
    });
  </script>
</body>
</html>
